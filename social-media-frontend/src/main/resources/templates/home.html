<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Posts</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
        }

        .post {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .post h4 {
            margin: 0;
            color: #333;
        }

        .post p {
            margin: 10px 0;
        }

        .post small {
            color: gray;
        }

        .no-data {
            color: red;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            display: inline-block;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>User Posts</h2>

    <a href="/member/users">⬅ Back to Users</a>

    <div th:if="${#lists.isEmpty(posts)}" class="no-data">
        No posts found for this user.
    </div>

    <div th:each="post : ${posts}" class="post">
        <h4 th:text="'Post ID: ' + ${post.postID}"></h4>
        <small th:text="'User ID: ' + ${post.user.userID}"></small>
        <p th:text="${post.content}"></p>
        <small th:text="${post.timestamp}"></small>
    </div>

</div>

</body>
</html>
