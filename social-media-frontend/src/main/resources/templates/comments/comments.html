<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comments API</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-hover: #fafbff;
            --border: #e4e8f0;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-mid: rgba(37, 99, 235, 0.18);
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --text-primary: #0f172a;
            --text-muted: #94a3b8;
            --gradient-hero: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
            --shadow-md: 0 4px 16px rgba(15,23,42,0.08);
            --shadow-hover: 0 12px 36px rgba(37,99,235,0.13);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
        }

        /* ── Topbar ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        /* ── Page ── */
        .page {
            max-width: 900px;
            margin: auto;
            padding: 48px 32px;
        }

        /* ── Breadcrumb ── */
        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .breadcrumb a {
            text-decoration: none;
            color: var(--text-muted);
        }

        /* ── Header ── */
        .page-label {
            background: var(--accent-soft);
            border: 1px solid var(--accent-mid);
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* ── Section Header ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── Grid ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* ── Card / Box ── */
        .box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: all 0.25s ease;
        }

        /* hover animation (same as dashboard cards) */
        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: var(--gradient-hero);
            transition: width 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(37,99,235,0.25);
        }

        .box:hover::before {
            width: 60%;
        }

        /* ── Header ── */
        .box-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .method {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .get { background: rgba(5,150,105,0.1); color: var(--success); }
        .post { background: var(--accent-soft); color: var(--accent); }
        .put { background: rgba(217,119,6,0.1); color: var(--warning); }
        .delete { background: rgba(220,38,38,0.1); color: var(--danger); }

        /* ── Inputs ── */
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        /* ── Buttons ── */
        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: var(--accent-soft);
            color: var(--accent);
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<nav class="topbar">
    <b>SocialPlatform</b>
    <span>Comments Module</span>
</nav>

<div class="page">

    <div class="breadcrumb">
        <a href="/">Home</a> › Comments API
    </div>

    <div class="page-label">Comments Module</div>
    <div class="page-title">Comments API</div>
    <div class="page-subtitle">Manage post comments</div>

    <div class="section-header">
        <div class="section-line"></div>
        <span class="section-label">Operations</span>
        <div class="section-line"></div>
    </div>

    <div class="grid">

        <!-- GET -->
        <div class="box">
            <div class="box-header">
                <span class="method get">GET</span>
                <h3>Fetch Comments</h3>
            </div>

            <a th:href="@{/member/comments/all}">
                <button>Get All Comments</button>
            </a>

            <form th:action="@{/member/comments/by-id}" method="get">
                <input name="id" placeholder="Comment ID" required>
                <button>Get Comment by Comment ID</button>
            </form>

            <form th:action="@{/member/comments/by-post}" method="get">
                <input name="postId" placeholder="Post ID" required>
                <button>Get Comments by Post ID</button>
            </form>

            <form th:action="@{/member/comments/by-user}" method="get">
                <input name="userId" placeholder="User ID" required>
                <button>Get Comments by User ID</button>
            </form>
        </div>

        <!-- CREATE -->
        <div class="box">
            <div class="box-header">
                <span class="method post">POST</span>
                <h3>Create Comment </h3>
            </div>


            <form th:action="@{/member/comments/create}" method="post">
                <input name="userId" placeholder="User ID" required>
                <input name="postId" placeholder="Post ID" required>
                <input name="comment_text" placeholder="Comment" required>
                <button>Create Comment</button>
            </form>
        </div>

        <!-- UPDATE -->
        <div class="box">
            <div class="box-header">
                <span class="method put">PUT</span>
                <h3>Update Comment</h3>
            </div>

            <form th:action="@{/member/comments/update}" method="post">
                <input name="commentID" placeholder="Comment ID" required>
                <input name="comment_text" placeholder="Updated Content" required>
                <button>Update</button>
            </form>
        </div>

        <!-- DELETE -->
        <div class="box">
            <div class="box-header">
                <span class="method delete">DELETE</span>
                <h3>Delete Comment</h3>
            </div>

            <form th:action="@{/member/comments/delete}" method="post">
                <input name="id" placeholder="Comment ID" required>
                <button>Delete</button>
            </form>
        </div>



    </div>
</div>

<script th:src="@{/js/endpoint-workbench.js}"></script>
</body>
</html>
