<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Friend Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --surface-alt: #0e1016;
            --border: rgba(255,255,255,0.07);
            --accent: #4f8ef7;
            --accent-soft: rgba(79, 142, 247, 0.12);
            --text-primary: #f0f2f8;
            --text-secondary: #7a8099;
            --text-muted: #454b62;
            --gradient-hero: linear-gradient(135deg, #4f8ef7 0%, #a78bfa 100%);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { text-align: center; padding: 52px 24px 0; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .back-link::before { content: '\2190'; }

        .badge {
            display: inline-flex;
            align-items: center;
            background: var(--accent-soft);
            border: 1px solid rgba(79,142,247,0.25);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .table-wrap { max-width: 960px; margin: 32px auto 80px; padding: 0 16px; }
        .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead tr { border-bottom: 1px solid var(--border); }
        th {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 16px 20px;
            text-align: left;
            background: var(--surface-alt);
        }
        td {
            padding: 16px 20px;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        tbody tr:last-child td { border-bottom: none; }
        td:first-child { color: var(--text-primary); font-weight: 600; }
        .empty-row td { text-align: center; color: var(--text-muted); }

        @media (max-width: 680px) {
            th, td { padding: 12px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

<header>
    <a href="/member/friends" class="back-link">Back to Friends</a>
    <br>
    <div class="badge">Friends Module</div>
    <h2>Friendship Results</h2>
</header>

<div class="table-wrap">
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Friendship ID</th>
                    <th>User 1 ID</th>
                    <th>User 2 ID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="friend : ${data}">
                    <td th:text="${friend.friendshipID}"></td>
                    <td th:text="${friend.user1 != null ? friend.user1.userID : '-'}"></td>
                    <td th:text="${friend.user2 != null ? friend.user2.userID : '-'}"></td>
                    <td th:text="${friend.status}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(data)}" class="empty-row">
                    <td colspan="4">No friendship records found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
