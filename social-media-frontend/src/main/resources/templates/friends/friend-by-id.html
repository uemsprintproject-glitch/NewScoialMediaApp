<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Friendship Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-alt: #f8f9fc;
            --border: #e4e8f0;
            --border-light: #eef1f7;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-mid: rgba(37, 99, 235, 0.18);
            --success: #059669;
            --success-soft: rgba(5, 150, 105, 0.08);
            --success-mid: rgba(5, 150, 105, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --gradient-hero: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
            --shadow-md: 0 4px 16px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .topbar-logo-mark {
            display: inline-flex;
            width: 30px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo-mark svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topbar-right {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .page {
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 32px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover { color: var(--accent); }

        .breadcrumb-sep {
            font-size: 11px;
            color: var(--border);
        }

        .breadcrumb-current {
            color: var(--text-secondary);
        }

        .page-title-wrap {
            margin-bottom: 28px;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-label::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .friend-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            height: 4px;
            background: var(--gradient-hero);
        }

        .card-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 28px 24px;
            border-bottom: 1px solid var(--border-light);
            background: linear-gradient(180deg, #fafbff 0%, #ffffff 100%);
            text-align: center;
        }

        .avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--gradient-hero);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(37,99,235,0.25);
        }

        .card-name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .id-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-alt);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 3px 12px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .id-pill-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .result-pill {
            display: inline-block;
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid var(--success-mid);
            border-radius: 100px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            word-break: break-word;
        }

        .card-fields { padding: 0; }

        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border-light);
            gap: 16px;
            transition: background 0.15s ease;
        }

        .field-row:last-child { border-bottom: none; }
        .field-row:hover { background: var(--surface-alt); }

        .field-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .field-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .field-icon svg {
            width: 14px;
            height: 14px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .field-value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: right;
            word-break: break-all;
        }

        .field-value.mono {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        @media (max-width: 480px) {
            .page { padding: 32px 16px 60px; }
            .topbar { padding: 0 20px; }
            .field-row { padding: 14px 20px; }
            .card-hero { padding: 28px 20px 22px; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a href="/" class="topbar-logo">
        <div class="topbar-logo-mark">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        SocialPlatform
    </a>
    <div class="topbar-right">Friends Module</div>
</nav>

<div class="page">

    <div class="breadcrumb">
        <a href="/">Home</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/member/friends">Friends</a>
        <span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">Friendship Data</span>
    </div>

    <div class="page-title-wrap">
        <div class="page-label">Record</div>
        <div class="page-title">Friendship Data</div>
        <div class="page-subtitle">Displaying retrieved friendship record</div>
    </div>

    <div class="friend-card" th:if="${resultMessage != null}">
        <div class="card-top"></div>
        <div class="card-hero">
            <div class="avatar">F</div>
            <div class="card-name">Check Result</div>
            <div class="result-pill" th:text="${resultMessage}">Users are friends</div>
        </div>
    </div>

    <div class="friend-card" th:if="${friend != null}">
        <div class="card-top"></div>

        <div class="card-hero">
            <div class="avatar">F</div>
            <div class="card-name">Friendship Profile</div>
            <div class="id-pill">
                <span class="id-pill-label">ID</span>
                <span th:text="${friend.friendshipID}">-</span>
            </div>
        </div>

        <div class="card-fields">
            <div class="field-row">
                <div class="field-left">
                    <div class="field-icon">
                        <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
                    </div>
                    <span class="field-label">Friendship ID</span>
                </div>
                <span class="field-value mono" th:text="${friend.friendshipID}">-</span>
            </div>

            <div class="field-row">
                <div class="field-left">
                    <div class="field-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <span class="field-label">User 1 ID</span>
                </div>
                <span class="field-value" th:text="${friend.user1 != null ? friend.user1.userID : '-'}">-</span>
            </div>

            <div class="field-row">
                <div class="field-left">
                    <div class="field-icon">
                        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <span class="field-label">User 2 ID</span>
                </div>
                <span class="field-value" th:text="${friend.user2 != null ? friend.user2.userID : '-'}">-</span>
            </div>

            <div class="field-row">
                <div class="field-left">
                    <div class="field-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                    </div>
                    <span class="field-label">Status</span>
                </div>
                <span class="field-value" th:text="${friend.status}">-</span>
            </div>
        </div>
    </div>

    <div class="friend-card" th:if="${friend == null and resultMessage == null}">
        <div class="card-top"></div>
        <div class="card-hero">
            <div class="avatar">?</div>
            <div class="card-name">No Data</div>
            <div class="result-pill">No friendship found.</div>
        </div>
    </div>

</div>
</body>
</html>
