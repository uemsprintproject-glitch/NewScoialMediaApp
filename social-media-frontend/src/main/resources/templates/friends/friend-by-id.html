<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Friendship Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --border: rgba(255,255,255,0.07);
            --accent: #4f8ef7;
            --accent-soft: rgba(79, 142, 247, 0.12);
            --text-primary: #f0f2f8;
            --text-secondary: #7a8099;
            --text-muted: #454b62;
            --gradient-hero: linear-gradient(135deg, #4f8ef7 0%, #a78bfa 100%);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        header { text-align: center; padding: 52px 24px 0; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .back-link::before { content: '\2190'; }
        .badge {
            display: inline-flex;
            align-items: center;
            background: var(--accent-soft);
            border: 1px solid rgba(79,142,247,0.25);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .card-wrap { max-width: 520px; margin: 32px auto 80px; padding: 0 16px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }
        .row:last-child { border-bottom: none; }
        .label {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .value { color: var(--text-secondary); text-align: right; }
    </style>
</head>
<body>
<header>
    <a href="/member/friends" class="back-link">Back to Friends</a>
    <br>
    <div class="badge">Friends Module</div>
    <h2>Friendship Data</h2>
</header>

<div class="card-wrap">
    <div class="card" th:if="${resultMessage != null}">
        <div class="row"><span class="label">Result</span><span class="value" th:text="${resultMessage}">-</span></div>
    </div>

    <div class="card" th:if="${friend != null}">
        <div class="row"><span class="label">Friendship ID</span><span class="value" th:text="${friend.friendshipID}">-</span></div>
        <div class="row"><span class="label">User 1 ID</span><span class="value" th:text="${friend.user1.userID}">-</span></div>
        <div class="row"><span class="label">User 2 ID</span><span class="value" th:text="${friend.user2.userID}">-</span></div>
        <div class="row"><span class="label">Status</span><span class="value" th:text="${friend.status}">-</span></div>
    </div>

    <div class="card" th:if="${friend == null}">
        <div class="row"><span class="label">Result</span><span class="value">No friendship found.</span></div>
    </div>
</div>
</body>
</html>
