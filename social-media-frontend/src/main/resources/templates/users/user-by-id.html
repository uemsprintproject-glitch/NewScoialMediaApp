<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --surface-alt: #0e1016;
            --border: rgba(255,255,255,0.07);
            --accent: #4f8ef7;
            --accent-soft: rgba(79, 142, 247, 0.12);
            --text-primary: #f0f2f8;
            --text-secondary: #7a8099;
            --text-muted: #454b62;
            --gradient-hero: linear-gradient(135deg, #4f8ef7 0%, #a78bfa 100%);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(ellipse at center, rgba(79,142,247,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        header {
            position: relative;
            z-index: 1;
            padding: 52px 24px 0;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
            margin-bottom: 28px;
        }

        .back-link:hover { color: var(--accent); }
        .back-link::before { content: '←'; font-size: 15px; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--accent-soft);
            border: 1px solid rgba(79,142,247,0.25);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header-sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* ── Divider ── */
        .divider {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 460px;
            margin: 36px auto 0;
            padding: 0 32px;
        }

        .divider-line { flex: 1; height: 1px; background: var(--border); }

        .divider-label {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Card ── */
        .card-wrap {
            position: relative;
            z-index: 1;
            max-width: 460px;
            margin: 32px auto 80px;
            padding: 0 32px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .user-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .user-card:hover {
            border-color: rgba(79,142,247,0.25);
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }

        /* gradient top bar */
        .card-top {
            height: 3px;
            background: var(--gradient-hero);
        }

        /* Avatar + name */
        .card-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 28px 28px;
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 2px solid rgba(79,142,247,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 16px;
            box-shadow: 0 0 0 6px rgba(79,142,247,0.06);
        }

        .card-name {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            margin-bottom: 10px;
        }

        .id-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(79,142,247,0.2);
            border-radius: 100px;
            padding: 3px 12px;
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Field rows */
        .card-fields { padding: 4px 0; }

        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }

        .field-row:last-child { border-bottom: none; }

        .field-label {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .field-value {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            text-align: right;
            word-break: break-all;
        }

        .field-value.highlight {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* ── Footer ── */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-bottom: 40px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 520px) {
            .card-wrap { padding: 0 16px; }
            .card-hero { padding: 28px 20px 22px; }
            .field-row { padding: 14px 20px; }
        }
    </style>
</head>
<body>

<header>
    <a href="/member/users" class="back-link">Back to Users</a>
    <br>
    <div class="badge">Users Module</div>
    <h2>User Data</h2>
    <p class="header-sub">Displaying retrieved user record</p>
</header>

<div class="divider">
    <div class="divider-line"></div>
    <span class="divider-label">Result</span>
    <div class="divider-line"></div>
</div>

<div class="card-wrap">
    <div class="user-card">
        <div class="card-top"></div>

        <div class="card-hero">
            <div class="avatar" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</div>
            <div class="card-name" th:text="${user.username}">Username</div>
            <div class="id-pill">ID &nbsp;<span th:text="${user.userID}">—</span></div>
        </div>

        <div class="card-fields">
            <div class="field-row">
                <span class="field-label">User ID</span>
                <span class="field-value" th:text="${user.userID}">—</span>
            </div>
            <div class="field-row">
                <span class="field-label">Username</span>
                <span class="field-value highlight" th:text="${user.username}">—</span>
            </div>
            <div class="field-row">
                <span class="field-label">Email</span>
                <span class="field-value" th:text="${user.email}">—</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
