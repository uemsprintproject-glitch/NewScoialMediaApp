<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-alt: #f8f9fc;
            --border: #e4e8f0;
            --border-light: #eef1f7;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-mid: rgba(37, 99, 235, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --gradient-hero: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Top nav ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .topbar-logo-mark {
            display: inline-flex;
            width: 30px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo-mark svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topbar-right {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ── Page ── */
        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        /* ── Breadcrumb ── */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 32px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--accent);
        }

        .breadcrumb-sep {
            color: var(--border);
        }

        .breadcrumb-current {
            color: var(--text-secondary);
        }

        /* ── Page title ── */
        .page-title-wrap {
            margin-bottom: 32px;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-label::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ── Section divider ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Table card ── */
        .table-wrap {
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        /* gradient top bar */
        .table-top {
            height: 3px;
            background: var(--gradient-hero);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* ── Head ── */
        thead tr {
            border-bottom: 1px solid var(--border);
        }

        th {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 14px 24px;
            text-align: left;
            background: var(--surface-alt);
        }

        /* ── Body ── */
        tbody tr {
            border-bottom: 1px solid var(--border-light);
            transition: background 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(37, 99, 235, 0.03);
        }

        td {
            padding: 15px 24px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: left;
            vertical-align: middle;
        }

        /* ID pill */
        td:first-child span {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
            border-radius: 5px;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* Username */
        td:nth-child(2) {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Email */
        td:nth-child(3) {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        /* ── Empty state ── */
        .empty-row td {
            text-align: center;
            padding: 56px 24px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        /* ── Footer row ── */
        .page-footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            background: var(--accent-soft);
            border: 1px solid var(--accent-mid);
            border-radius: 8px;
            padding: 7px 14px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .back-btn:hover {
            background: rgba(37, 99, 235, 0.14);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        }

        .back-btn::before {
            content: '←';
        }

        .pagination-bar {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-muted);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-mid);
            background: var(--accent-soft);
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .page-btn:hover {
            background: rgba(37, 99, 235, 0.14);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        }

        .page-btn.disabled {
            opacity: 0.45;
            pointer-events: none;
            cursor: default;
            box-shadow: none;
        }

        .page-status {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .page {
                padding: 32px 16px 60px;
            }

            .topbar {
                padding: 0 20px;
            }

            th,
            td {
                padding: 12px 14px;
                font-size: 13px;
            }

            .pagination-controls {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <!-- Top nav -->
    <nav class="topbar">
        <a href="/" class="topbar-logo">
            <div class="topbar-logo-mark">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            SocialPlatform
        </a>
        <div class="topbar-right">Users Module</div>
    </nav>

    <div class="page">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="/">Home</a>
            <span class="breadcrumb-sep">›</span>
            <a href="/member/users">Users</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current">All Users</span>
        </div>

        <!-- Title -->
        <div class="page-title-wrap">
            <div class="page-label">Users Module</div>
            <div class="page-title">User Data</div>
            <div class="page-subtitle">Displaying all retrieved user records</div>
        </div>

        <!-- Section divider -->
        <div class="section-header">
            <div class="section-line"></div>
            <span class="section-label">Results</span>
            <div class="section-line"></div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <div class="table-card">
                <div class="table-top"></div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${data}">
                            <td><span th:text="${user.userID}"></span></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.email}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(data)}" class="empty-row">
                            <td colspan="3">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-bar">
                <div th:text="|Showing ${#lists.size(data)} of ${totalItems} users|">Showing 0 of 0 users</div>
                <div class="pagination-controls">
                    <a class="page-btn" th:classappend="${!hasPrevious} ? ' disabled'" th:href="${previousPageUrl}"
                        th:attr="aria-disabled=${!hasPrevious}">Previous</a>
                    <span class="page-status" th:text="|Page ${currentPage + 1} of ${totalPages}|">Page 1 of 1</span>
                    <a class="page-btn" th:classappend="${!hasNext} ? ' disabled'" th:href="${nextPageUrl}"
                        th:attr="aria-disabled=${!hasNext}">Next</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
