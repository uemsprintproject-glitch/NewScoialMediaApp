<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users API</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --surface-hover: #181c24;
            --surface-input: #0e1016;
            --border: rgba(255,255,255,0.07);
            --border-input: rgba(255,255,255,0.1);
            --accent: #4f8ef7;
            --accent-soft: rgba(79, 142, 247, 0.12);
            --accent-glow: rgba(79, 142, 247, 0.2);
            --danger: #f7584f;
            --danger-soft: rgba(247, 88, 79, 0.12);
            --success: #4fca8e;
            --success-soft: rgba(79, 202, 142, 0.12);
            --warning: #f7a84f;
            --warning-soft: rgba(247, 168, 79, 0.12);
            --purple: #a78bfa;
            --purple-soft: rgba(167, 139, 250, 0.12);
            --text-primary: #f0f2f8;
            --text-secondary: #7a8099;
            --text-muted: #454b62;
            --gradient-hero: linear-gradient(135deg, #4f8ef7 0%, #a78bfa 100%);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(ellipse at center, rgba(79,142,247,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        header {
            position: relative;
            z-index: 1;
            padding: 52px 24px 0;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
            margin-bottom: 28px;
        }

        .back-link:hover { color: var(--accent); }

        .back-link::before {
            content: '←';
            font-size: 15px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--accent-soft);
            border: 1px solid rgba(79,142,247,0.25);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header-sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* ── Divider ── */
        .divider {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 780px;
            margin: 40px auto 0;
            padding: 0 32px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-label {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Grid ── */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 780px;
            margin: 36px auto 80px;
            padding: 0 32px;
        }

        /* GET USER POSTS spans full width */
        .box:last-child {
            grid-column: 1 / -1;
            max-width: 360px;
            justify-self: center;
            width: 100%;
        }

        /* ── Box / Card ── */
        .box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px 28px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.5s ease both;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .box:nth-child(1) { animation-delay: 0.05s; }
        .box:nth-child(2) { animation-delay: 0.12s; }
        .box:nth-child(3) { animation-delay: 0.19s; }
        .box:nth-child(4) { animation-delay: 0.26s; }
        .box:nth-child(5) { animation-delay: 0.33s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .box:hover {
            border-color: rgba(79,142,247,0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }

        /* ── Box header row ── */
        .box-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .method-badge {
            font-family: 'Syne', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 3px 9px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .method-get {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(79,202,142,0.2);
        }

        .method-post {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(79,142,247,0.2);
        }

        .method-delete {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid rgba(247,88,79,0.2);
        }

        .method-put {
            background: var(--warning-soft);
            color: var(--warning);
            border: 1px solid rgba(247,168,79,0.2);
        }

        .box h2 {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        /* ── Separator inside box ── */
        .box-sep {
            height: 1px;
            background: var(--border);
            margin: 0 0 20px;
        }

        /* ── Form elements ── */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 100%;
            background: var(--surface-input);
            border: 1px solid var(--border-input);
            border-radius: 10px;
            padding: 11px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder { color: var(--text-muted); }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* ── Buttons ── */
        button, .btn {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 11px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            letter-spacing: 0.02em;
            width: 100%;
        }

        button:hover { opacity: 0.88; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .btn-get {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(79,202,142,0.25);
        }

        .btn-post {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(79,142,247,0.25);
        }

        .btn-delete {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid rgba(247,88,79,0.25);
        }

        .btn-put {
            background: var(--warning-soft);
            color: var(--warning);
            border: 1px solid rgba(247,168,79,0.25);
        }

        /* inline get-all link styled as button */
        .btn-link {
            display: block;
            text-decoration: none;
            text-align: center;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0;
        }

        .or-divider span {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Footer ── */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-bottom: 40px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── Responsive ── */
        @media (max-width: 620px) {
            .container {
                grid-template-columns: 1fr;
                padding: 0 16px;
            }
            .box:last-child { grid-column: auto; max-width: 100%; }
        }
    </style>
</head>

<body>

<header>
    <a th:href="@{/}" class="back-link">Back to Home</a>
    <br>
    <div class="badge">Users Module</div>
    <h1>Users API</h1>
    <p class="header-sub">Anishka Das &mdash; Manage platform users</p>
</header>


<a th:href="@{/}">⬅ Back to Home</a>

<div class="container">

   
    <a th:href="@{/member/users/all}">
        <button>Get All Users</button>
    </a>

   
    <form th:action="@{/member/users/by-id}" method="get">
        <input name="id" placeholder="Enter User ID">
        <button type="submit">Get User By ID</button>
    </form>
</div>

        <div class="or-divider"><span>or search by ID</span></div>

    <form th:action="@{/member/users/create}" method="post">
        <input name="username" placeholder="Username"><br>
        <input name="email" placeholder="Email"><br>
        <input name="password" placeholder="Password"><br>

    <!-- CREATE -->
    <div class="box">
        <div class="box-header">
            <span class="method-badge method-post">POST</span>
            <h2>Create User</h2>
        </div>
        <div class="box-sep"></div>

        <form th:action="@{/member/users/create}" method="post">
            <input name="username" placeholder="Username" required>
            <input name="email" placeholder="Email" required>
            <input name="password" placeholder="Password" type="password" required>
            <button type="submit" class="btn-post">Create User</button>
        </form>
    </div>

    <form th:action="@{/member/users/update}" method="post">
        <input name="userID" placeholder="User ID"><br>
        <input name="username" placeholder="Username"><br>
        <input name="email" placeholder="Email"><br>
        <input name="password" placeholder="Password"><br>

        <form th:action="@{/member/users/update}" method="post">
            <input name="userID" placeholder="User ID" required>
            <input name="username" placeholder="New Username">
            <input name="email" placeholder="New Email">
            <input name="password" placeholder="New Password" type="password">
            <button type="submit" class="btn-put">Update User</button>
        </form>
    </div>

    <!-- DELETE -->
    <div class="box">
        <div class="box-header">
            <span class="method-badge method-delete">DELETE</span>
            <h2>Delete User</h2>
        </div>
        <div class="box-sep"></div>

    <form th:action="@{/member/users/delete}" method="post">
        <input name="id" placeholder="User ID">
        <button type="submit">Delete</button>
    </form>
</div>

        <form th:action="@{/member/users/posts}" method="get">
            <input name="id" placeholder="User ID" required>
            <button type="submit" class="btn-get">Get Posts</button>
        </form>
    </div>

    <form th:action="@{/member/users/posts}" method="get">
        <input name="id" placeholder="User ID"><br>
        <button type="submit">Get Posts</button>
    </form>
</div>

</body>
</html>
