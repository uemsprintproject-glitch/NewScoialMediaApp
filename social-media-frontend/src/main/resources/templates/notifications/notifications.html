<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Notifications API</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-alt: #f8f9fc;
            --surface-input: #f4f6fa;
            --border: #e4e8f0;
            --border-input: #d8dde8;
            --border-light: #eef1f7;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-mid: rgba(37, 99, 235, 0.18);
            --success: #059669;
            --success-soft: rgba(5, 150, 105, 0.08);
            --success-mid: rgba(5, 150, 105, 0.18);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.08);
            --danger-mid: rgba(220, 38, 38, 0.18);
            --warning: #d97706;
            --warning-soft: rgba(217, 119, 6, 0.08);
            --warning-mid: rgba(217, 119, 6, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --gradient-hero: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .topbar-logo-mark {
            display: inline-flex;
            width: 30px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo-mark svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topbar-right {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 32px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--accent);
        }

        .breadcrumb-sep {
            color: var(--border);
            font-size: 13px;
        }

        .breadcrumb-current {
            color: var(--text-secondary);
        }

        .page-title-wrap {
            margin-bottom: 36px;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-label::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        .box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 26px 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            animation: fadeUp 0.4s ease both;
        }

        .box:nth-child(1) {
            animation-delay: 0.04s;
        }

        .box:nth-child(2) {
            animation-delay: 0.10s;
        }

        .box:nth-child(3) {
            animation-delay: 0.16s;
        }

        .box:nth-child(4) {
            animation-delay: 0.22s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .box:hover {
            box-shadow: var(--shadow-md);
            border-color: #d0d7e8;
        }

        .box-accent {
            height: 3px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .accent-get {
            background: linear-gradient(90deg, #059669, #34d399);
        }

        .accent-post {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
        }

        .accent-put {
            background: linear-gradient(90deg, #d97706, #f59e0b);
        }

        .accent-delete {
            background: linear-gradient(90deg, #dc2626, #f87171);
        }

        .box-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .method-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding: 3px 9px;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .method-get {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid var(--success-mid);
        }

        .method-post {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
        }

        .method-delete {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-mid);
        }

        .method-put {
            background: var(--warning-soft);
            color: var(--warning);
            border: 1px solid var(--warning-mid);
        }

        .box h2 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .box-sep {
            height: 1px;
            background: var(--border-light);
            margin: 0 0 18px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        input {
            width: 100%;
            background: var(--surface-input);
            border: 1px solid var(--border-input);
            border-radius: 8px;
            padding: 10px 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--surface);
        }

        button {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
            letter-spacing: 0.01em;
        }

        button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-get {
            background: var(--success-soft);
            color: var(--success);
            border-color: var(--success-mid);
        }

        .btn-post {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent-mid);
        }

        .btn-delete {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: var(--danger-mid);
        }

        .btn-put {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: var(--warning-mid);
        }

        .btn-link {
            display: block;
            text-decoration: none;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .or-divider span {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
        }

        @media (max-width: 620px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 32px 16px 60px;
            }

            .topbar {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="topbar">
        <a th:href="@{/}" class="topbar-logo">
            <div class="topbar-logo-mark">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            SocialPlatform
        </a>
        <div class="topbar-right">Notifications Module</div>
    </nav>

    <div class="page">

        <div class="breadcrumb">
            <a th:href="@{/}">Home</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current">Notifications API</span>
        </div>

        <div class="page-title-wrap">
            <div class="page-label">Notifications Module</div>
            <div class="page-title">Notifications API</div>
            <div class="page-subtitle">Soumyajit Sen Gupta - Manage user notifications</div>
        </div>

        <div class="section-header">
            <div class="section-line"></div>
            <span class="section-label">Operations</span>
            <div class="section-line"></div>
        </div>

        <div class="grid">

            <div class="box">
                <div class="box-accent accent-get"></div>
                <div class="box-header">
                    <span class="method-badge method-get">GET</span>
                    <h2>Fetch Notifications</h2>
                </div>
                <div class="box-sep"></div>

                <a th:href="@{/member/notifications/all}" class="btn-link">
                    <button class="btn-get">Get All Notifications</button>
                </a>

                <div class="or-divider"><span>or filter records</span></div>

                <form th:action="@{/member/notifications/by-id}" method="get">
                    <input name="id" placeholder="Enter Notification ID" required>
                    <button type="submit" class="btn-get">Get Notification By ID</button>
                </form>

                <form th:action="@{/member/notifications/by-user}" method="get">
                    <input name="userID" placeholder="Enter User ID" required>
                    <button type="submit" class="btn-get">Get Notifications By User</button>
                </form>
            </div>

            <div class="box">
                <div class="box-accent accent-post"></div>
                <div class="box-header">
                    <span class="method-badge method-post">POST</span>
                    <h2>Create Notification</h2>
                </div>
                <div class="box-sep"></div>

                <form th:action="@{/member/notifications/create}" method="post">
                    <input name="content" placeholder="Content" required>
                    <input name="userID" placeholder="User ID" required>
                    <button type="submit" class="btn-post">Create Notification</button>
                </form>
            </div>

            <div class="box">
                <div class="box-accent accent-put"></div>
                <div class="box-header">
                    <span class="method-badge method-put">PUT</span>
                    <h2>Update Notification</h2>
                </div>
                <div class="box-sep"></div>

                <form th:action="@{/member/notifications/update}" method="post">
                    <input name="notificationID" placeholder="Notification ID" required>
                    <input name="content" placeholder="Content" required>
                    <input name="userID" placeholder="User ID" required>
                    <button type="submit" class="btn-put">Update Notification</button>
                </form>
            </div>

            <div class="box">
                <div class="box-accent accent-delete"></div>
                <div class="box-header">
                    <span class="method-badge method-delete">DELETE</span>
                    <h2>Delete Notification</h2>
                </div>
                <div class="box-sep"></div>

                <form th:action="@{/member/notifications/delete}" method="post">
                    <input name="id" placeholder="Notification ID" required>
                    <button type="submit" class="btn-delete">Delete Notification</button>
                </form>
            </div>

        </div>
    </div>

</body>

</html>
