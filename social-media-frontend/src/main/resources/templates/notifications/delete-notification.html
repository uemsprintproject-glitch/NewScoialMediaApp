<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Delete Notification</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-alt: #f8f9fc;
            --border: #e4e8f0;
            --border-input: #d8dde8;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.08);
            --danger-mid: rgba(220, 38, 38, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --gradient-hero: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .topbar-logo-mark {
            display: inline-flex;
            width: 30px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo-mark svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topbar-right {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .page {
            max-width: 520px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 32px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--accent);
        }

        .breadcrumb-sep {
            color: var(--border);
        }

        .breadcrumb-current {
            color: var(--text-secondary);
        }

        .page-title-wrap {
            margin-bottom: 28px;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-mid);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-label::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .page-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-bar {
            height: 3px;
            background: linear-gradient(90deg, #dc2626, #f87171);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 24px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-alt);
        }

        .method-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding: 3px 9px;
            border-radius: 5px;
            text-transform: uppercase;
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-mid);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-path {
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
        }

        .card-body {
            padding: 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border-input);
            border-radius: 8px;
            padding: 11px 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--surface);
        }

        .field-hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-submit {
            width: 100%;
            padding: 12px 18px;
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-mid);
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.15s ease;
            letter-spacing: 0.01em;
        }

        .btn-submit:hover {
            background: rgba(220, 38, 38, 0.14);
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.15);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        @media (max-width: 560px) {
            .page {
                padding: 32px 16px 60px;
            }

            .topbar {
                padding: 0 20px;
            }

            .card-path {
                display: none;
            }
        }
    </style>
</head>

<body>

    <nav class="topbar">
        <a th:href="@{/}" class="topbar-logo">
            <div class="topbar-logo-mark">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            SocialPlatform
        </a>
        <div class="topbar-right">Notifications Module</div>
    </nav>

    <div class="page">

        <div class="breadcrumb">
            <a th:href="@{/}">Home</a>
            <span class="breadcrumb-sep">›</span>
            <a th:href="@{/member/notifications}">Notifications</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current">Delete Notification</span>
        </div>

        <div class="page-title-wrap">
            <div class="page-label">DELETE</div>
            <div class="page-title">Delete Notification</div>
            <div class="page-subtitle">Delete a notification by notification ID</div>
        </div>

        <div class="form-card">
            <div class="card-bar"></div>
            <div class="card-header">
                <span class="method-badge">DELETE</span>
                <span class="card-title">Delete Record</span>
                <span class="card-path">/member/notifications/delete</span>
            </div>
            <div class="card-body">
                <form th:action="@{/member/notifications/delete}" method="post">
                    <div class="field">
                        <label for="id">Notification ID</label>
                        <input id="id" name="id" placeholder="e.g. 301" required>
                        <div class="field-hint">Enter the notification ID you want to remove.</div>
                    </div>
                    <button type="submit" class="btn-submit">Delete Notification →</button>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
