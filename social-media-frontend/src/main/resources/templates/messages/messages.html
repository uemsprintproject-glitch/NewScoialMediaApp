<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Messages Module</title>
    <style>
        body { font-family: Arial; text-align: center; background-color: #f9f9f9; }
        h1 { margin-top: 20px; }
        .box {
            background: white; border-radius: 10px; padding: 20px;
            margin: 20px auto; width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input { margin: 5px; padding: 8px; width: 80%; }
        button { padding: 8px 15px; margin-top: 10px; cursor: pointer; }
        a { text-decoration: none; }
    </style>
</head>
<body>

<h1>💬 Ashmit Dutta - Messages Module</h1>
<a th:href="@{/}">⬅ Back to Home</a>

<div class="box">
    <h2>GET</h2>

    <a th:href="@{/messages/all}">
        <button>Get All Messages</button>
    </a>

    <form th:action="@{/messages/by-id}" method="get">
        <input name="id" placeholder="Enter Message ID">
        <button type="submit">Get Message By ID</button>
    </form>

    <form th:action="@{/messages/by-sender}" method="get">
        <input name="senderId" placeholder="Enter Sender User ID">
        <button type="submit">Get By Sender</button>
    </form>

    <form th:action="@{/messages/by-receiver}" method="get">
        <input name="receiverId" placeholder="Enter Receiver User ID">
        <button type="submit">Get By Receiver</button>
    </form>

    <form th:action="@{/messages/conversation}" method="get">
        <input name="user1" placeholder="User ID 1">
        <input name="user2" placeholder="User ID 2">
        <button type="submit">Get Conversation</button>
    </form>
</div>

<div class="box">
    <h2>SEND MESSAGE</h2>
    <form th:action="@{/messages/send}" method="post">
        <input name="senderID" placeholder="Sender User ID"><br>
        <input name="receiverID" placeholder="Receiver User ID"><br>
        <input name="message_text" placeholder="Message Text"><br>
        <button type="submit">Send Message</button>
    </form>
</div>

<div class="box">
    <h2>DELETE MESSAGE</h2>
    <form th:action="@{/messages/delete}" method="post">
        <input name="id" placeholder="Message ID">
        <button type="submit">Delete</button>
    </form>
</div>

</body>
</html>
