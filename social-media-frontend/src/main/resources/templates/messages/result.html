<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Message Results</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
        }

        table {
            width: 80%;
            margin: 40px auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #444;
            text-align: center;
        }

        th {
            background: #222;
        }

        tr:hover {
            background: #333;
        }

        a {
            color: gray;
            margin-left: 20px;
        }
    </style>
</head>

<body>

<a href="/member/messages">← Back</a>
<h2 style="text-align:center;">Message Data</h2>

<table>

    <thead>
    <tr>
        <th>Message ID</th>
        <th>Sender ID</th>
        <th>Receiver ID</th>
        <th>Message</th>
        <th>Timestamp</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="msg : ${data}">
    <td><span th:text="${msg.messageID}"></span></td>

    

    
    <td th:text="${msg.sender.username}"></td>
    <td th:text="${msg.receiver.username}"></td>

    <td th:text="${msg.message_text}"></td>

    <td th:text="${msg.timestamp}"></td>
</tr>

    <tr th:if="${#lists.isEmpty(data)}">
        <td colspan="5">No messages found</td>
    </tr>

    </tbody>

</table>

</body>
</html>
