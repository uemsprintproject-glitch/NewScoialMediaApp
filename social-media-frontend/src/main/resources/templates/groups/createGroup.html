<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Group</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f9f9f9;
        }
        h1 { margin-top: 20px; }
        .box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input {
            margin: 5px;
            padding: 8px;
            width: 80%;
        }
        button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
        a {
            text-decoration: none;
            color: #007BFF;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>➕ Create New Group</h1>
<a th:href="@{/member/groups}">⬅ Back to Groups</a>

<div class="box">
    <form th:action="@{/member/groups/create}" method="post">
        <input name="groupName" placeholder="Group Name"><br>
        <input name="admin.userID" placeholder="Admin User ID"><br>
        <button type="submit">Create Group</button>
    </form>
</div>

<!-- Quick links to other endpoints -->
<div class="box">
    <h2>Other Actions</h2>
    <a th:href="@{/member/groups/all}"><button type="button">View All Groups</button></a><br>
    <a th:href="@{/member/groups}"><button type="button">Back to Groups Home</button></a>
</div>

</body>
</html>
