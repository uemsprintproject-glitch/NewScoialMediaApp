<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-input: #f4f6fa;
            --border: #e4e8f0;
            --border-input: #d8dde8;
            --border-light: #eef1f7;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-mid: rgba(37, 99, 235, 0.18);
            --success: #059669;
            --success-soft: rgba(5, 150, 105, 0.08);
            --success-mid: rgba(5, 150, 105, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --gradient-hero: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .topbar-logo-mark {
            display: inline-flex;
            width: 30px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo-mark svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topbar-right {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 32px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--accent);
        }

        .breadcrumb-sep {
            color: var(--border);
        }

        .breadcrumb-current {
            color: var(--text-secondary);
        }

        .page-title-wrap {
            margin-bottom: 30px;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            animation: fadeUp 0.4s ease both;
            margin-bottom: 20px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-top {
            height: 3px;
            background: var(--gradient-hero);
        }

        .panel-body {
            padding: 24px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .method-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding: 3px 9px;
            border-radius: 5px;
            text-transform: uppercase;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
        }

        .panel-title h2 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .panel-sep {
            height: 1px;
            background: var(--border-light);
            margin-bottom: 16px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input {
            width: 100%;
            background: var(--surface-input);
            border: 1px solid var(--border-input);
            border-radius: 8px;
            padding: 10px 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--surface);
        }

        button {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
            letter-spacing: 0.01em;
        }

        button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-post {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent-mid);
        }

        .btn-get {
            background: var(--success-soft);
            color: var(--success);
            border-color: var(--success-mid);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-link {
            text-decoration: none;
            display: block;
        }

        @media (max-width: 640px) {
            .page {
                padding: 32px 16px 60px;
            }

            .topbar {
                padding: 0 20px;
            }

            .actions,
            .box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="topbar">
        <a th:href="@{/}" class="topbar-logo">
            <div class="topbar-logo-mark">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            SocialPlatform
        </a>
        <div class="topbar-right">Groups Module</div>
    </nav>

    <div class="page">
        <div class="breadcrumb">
            <a th:href="@{/}">Home</a>
            <span class="breadcrumb-sep">›</span>
            <a th:href="@{/member/groups}">Groups API</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current">Create Group</span>
        </div>

        <div class="page-title-wrap">
            <div class="page-label">Groups Module</div>
            <div class="page-title">Create New Group</div>
            <div class="page-subtitle">Add a new group with an admin owner</div>
        </div>

        <div class="panel">
            <div class="panel-top"></div>
            <div class="panel-body">
                <div class="panel-title">
                    <span class="method-badge">POST</span>
                    <h2>Create Group Endpoint</h2>
                </div>
                <div class="panel-sep"></div>

                <form th:action="@{/member/groups/create}" method="post">
                    <input name="groupName" placeholder="Group Name" required>
                    <input name="admin.userID" placeholder="Admin User ID" required>
                    <button type="submit" class="btn-post">Create Group</button>
                </form>
            </div>
        </div>

        <div class="panel">
            <div class="panel-top"></div>
            <div class="panel-body">
                <div class="panel-title">
                    <span class="method-badge"
                        style="background: var(--success-soft); color: var(--success); border-color: var(--success-mid);">GET</span>
                    <h2>Quick Actions</h2>
                </div>
                <div class="panel-sep"></div>

                <div class="actions">
                    <a th:href="@{/member/groups/all}" class="btn-link">
                        <button type="button" class="btn-get">View All Groups</button>
                    </a>
                    <a th:href="@{/member/groups}" class="btn-link">
                        <button type="button" class="btn-get">Back To Groups API</button>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
